name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Format check
      run: bun run format:check

    - name: Generate snapshots
      run: bun run snapshot index.tsx

    - name: Check for snapshot changes
      run: |
        if ! git diff --exit-code __snapshots__/; then
          echo "❌ Snapshots changed! Run 'bun run snapshot:update' locally"
          exit 1
        fi
        echo "✅ Snapshots match"
